name: Deploy map to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp map.html map.js index.html README.md _site/
          cp -r resources css webfonts images build _site/
          # Item wiki pages use paths relative to /build/
          mkdir -p _site/build/css _site/build/images
          cp css/all.min.css css/fontawesome.min.css _site/build/css/
          cp -r images/icons _site/build/images/
          cp images/ddon-logo.png _site/build/images/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
