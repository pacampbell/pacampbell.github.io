# GitHub Pages (Jekyll) — exclude dev/tooling paths if branch-based deploy is used.
# The Actions workflow copies map + build explicitly; this list is for Jekyll parity.
exclude:
  - tools
  - scripts
  - templates
  - test-results
  - quest.html
  - quest.js
  - main.py
  - QuestTool.py
  - command.txt
  - images/news
  - images/main_quest
  - images/substory
  - images/wildhunt
